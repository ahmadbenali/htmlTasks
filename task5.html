<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task5</title>
</head>
<body>
    <h1>Images in Tables</h1>
    
    <hr>

    <h3>What are your favorite pets ?</h3>

    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <th>Pet Image</th>
            <th>More Facts about (as a Link)</th>
        </tr>
        <tr>
            <td>
                <img src="horse.png" alt="Horse" width="220" height="150">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Horse">Horse</a>
            </td>
        </tr>
        <tr>
            <td>
                <img src="dogs.jpg" alt="Dogs" width="220" height="150">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Dog">Dogs</a>
            </td>
        </tr>
        <tr>
            <td>
                <img src="cats.jpg" alt="Cats" width="220" height="150">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Cat">Cats</a>
            </td>
        </tr>
    </table>
</body>
</html>
